version: 2
updates:
  # The actions in the workflows are pinned to a commit SHA (with the version in a comment); this proposes the updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The base images of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
