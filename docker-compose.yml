# Tinker MCP (inventory of home devices + search in their manuals). Everything Tinker needs is in this file plus the
# ${VARIABLES}: put them in a `.env` next to this file (copy `.env.template`), in the environment of the shell that runs
# compose, or in the variables of your stack editor (Portainer, Dockge...). The ones with `:?` are required: compose refuses
# to start without them.
services:
  tinker:
    # The published image (see README, "Updating"). To build it from this repository instead, uncomment `build` and
    # use `docker compose up -d --build`.
    image: ghcr.io/javixulo/tinker:${TINKER_VERSION:?Set TINKER_VERSION to latest or to a version such as 0.1.0 (see CHANGELOG.md)}
    # build: .
    container_name: tinker-mcp
    restart: unless-stopped
    # Non-root. This user id and main group must be able to write the data folder (see README, "Permissions").
    user: "${TINKER_UID:-1000}:${TINKER_GID:-1000}"
    # Additional group of the process, to read the manuals. The groups of a host user do NOT reach the container: only
    # these numbers count. Unset, it repeats the main group and adds nothing.
    group_add:
      - "${TINKER_MANUALS_GID:-${TINKER_GID:-1000}}"
    ports:
      - "${TINKER_PORT:-7843}:8080"
    # Least privilege: Tinker only serves HTTP and writes its own data folder.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # The embedding model: texts per run (more uses more memory) and CPU threads (0: automatic). See README, "Configuration".
      Tinker__EmbeddingBatchSize: ${TINKER_EMBEDDING_BATCH_SIZE:-4}
      Tinker__EmbeddingThreads: ${TINKER_EMBEDDING_THREADS:-0}
      # OpenTelemetry (Seq accepts OTLP over HTTP). Leave empty to export nothing; logs still go to `docker logs`.
      OTEL_SERVICE_NAME: tinker-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Seq only accepts HTTP: the SDK default (gRPC) would fail silently. Change it only if the backend changes.
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production
    volumes:
      # Database: a bind mount on a LOCAL disk of the host (SQLite locking is not reliable over NFS or SMB).
      - ${TINKER_DATA:-./data}:/data
      # The user's manuals, read-only: the server never writes them.
      - ${TINKER_MANUALS:-./manuals}:/manuals:ro
      # The embedding model (BAAI/bge-small-en-v1.5) is inside the image. To use other files instead, mount them:
      # - /path/to/bge-small-en-v1.5:/models/bge-small-en-v1.5:ro
